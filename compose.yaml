name: pxdca-server

services:
  mcp:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PXDCA_CONFIG: /srv/pxdca/config/pxdca.toml
      PXDCA_HOST: 0.0.0.0
      PXDCA_PORT: 8000
      PXDCA_TRANSPORT: http
      PXDCA_STATE_ROOT: /srv/pxdca/data/state
      PXDCA_ARTIFACT_ROOT: /srv/pxdca/data/artifacts
      PXDCA_LOG_ROOT: /srv/pxdca/data/logs
    ports:
      - "${PXDCA_BIND_HOST:-127.0.0.1}:${PXDCA_HOST_PORT:-8000}:8000"
    volumes:
      - "${PXDCA_CONFIG_FILE:-./config/pxdca.toml}:/srv/pxdca/config/pxdca.toml:ro"
      - pxdca-state:/srv/pxdca/data/state
      - pxdca-artifacts:/srv/pxdca/data/artifacts
      - pxdca-logs:/srv/pxdca/data/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1',8000),2); s.close()"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  pxdca-state:
  pxdca-artifacts:
  pxdca-logs:
